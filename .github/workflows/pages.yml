name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check website
        run: |
          python3 scripts/check.py
          node --check assets/site.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare only public website files
        run: |
          mkdir -p _site/policy
          cp index.html .nojekyll robots.txt sitemap.xml _site/
          cp policy/index.html _site/policy/
          cp -R assets _site/assets
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
