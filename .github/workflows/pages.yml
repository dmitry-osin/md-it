name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.store.outputs.deploy }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check website
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --check assets/site.js
      - name: Prepare only public website files
        run: |
          mkdir -p _site/policy
          cp index.html .nojekyll robots.txt sitemap.xml _site/
          cp policy/index.html _site/policy/
          cp -R assets _site/assets
      - name: Check Chrome Web Store availability
        id: store
        run: python3 scripts/store_status.py
      - name: Configure Pages
        if: steps.store.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.store.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: prepare
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
